        echo "✅ Runner Environment: GPU DinD Runner confirmed"
        echo "✅ Docker Functionality: Basic and advanced operations working"
        echo "✅ Docker Compose: Complex multi-service orchestration successful"
        echo "✅ GPU Availability: GPU resources accessible in containers"
        echo "✅ Scientific Computing: Python GPU computing stack functional"
        echo "✅ Performance Testing: GPU computation benchmarks completed"
        echo "✅ Multi-Container Workflow: GPU scientific workflow successful"
        echo ""
        echo "🚀 CONCLUSION: The GPU DinD Runner is fully functional and ready for:"
        echo "   • Docker container operations"
        echo "   • Docker Compose multi-service applications"
        echo "   • GPU-accelerated scientific computing workloads"
        echo "   • Complex data processing pipelines"
        echo "   • Machine learning and AI model training"
        echo ""
        echo "🎯 This runner can now be used for GPU-intensive CI/CD workflows!"

    # ========================================================================================
    # 错误处理
    # ========================================================================================
    - name: "🚨 Error Handling & Cleanup"
      if: failure()
      run: |
        echo "==================== ERROR HANDLING & CLEANUP ===================="
        echo "❌ Test workflow failed. Performing cleanup..."
        
        echo "Stopping any running containers:"
        docker ps -q | xargs -r docker stop
        
        echo "Removing any test containers:"
        docker ps -aq | xargs -r docker rm
        
        echo "Cleaning up Docker resources:"
        docker system prune -f
        
        echo "Removing test files:"
        rm -rf html app init.sql docker-compose.yml gpu-workflow-compose.yml shared-data
        rm -f numpy_test.py tensorflow_test.py pytorch_test.py
        
        echo "Final Docker state:"
        docker ps -a
        docker images
        
        echo "System resources:"
        free -h
        df -h
        
        echo "🔍 Recent Docker logs for debugging:"
        docker logs $(docker ps -lq) 2>/dev/null || echo "No recent container logs available"